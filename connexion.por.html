
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Porsche ID</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #ffffff;
            position: relative;
        }

        /* Conteneur de l'image de la voiture en arrière-plan */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .background-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Bouton Retour vers por.html */
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            text-decoration: none;
            color: #111;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s;
            z-index: 3;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.85);
        }

        /* Conteneur principal pour centrer le cadre */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* Cadre en verre translucide (Glassmorphism) au format portrait */
        .glass-card {
            width: 100%;
            max-width: 400px;
            min-height: 520px;
            background: rgba(255, 255, 255, 0.35); /* Effet verre translucide lumineux */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* En-tête Porsche parfaitement centré */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .porsche-logo {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 15px;
            color: #000;
        }

        /* Titre sur une seule ligne */
        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            margin-bottom: 25px;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #222;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            font-size: 14px;
            color: #000;
            outline: none;
            transition: all 0.2s;
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        input:focus {
            border-color: #000;
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* Bouton Continuer */
        .btn-continue {
            width: 100%;
            padding: 13px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-continue:hover {
            background-color: #222;
        }

        /* Pied de page inscription */
        .register-section {
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            color: #222;
        }

        .register-section a {
            color: #000;
            text-decoration: underline;
            font-weight: 600;
        }

        /* Responsive pour mobiles */
        @media (max-width: 480px) {
            .glass-card {
                padding: 25px 20px;
                min-height: 480px;
            }
            h1 {
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>

    <!-- Image de la voiture en arrière-plan intégrée via HTML -->
    <div class="background-container">
        <img src="PO.jpg" alt="Porsche 718 Cayman GT4 RS Arrière-plan"> <!--[cite: 2] -->
    </div>

    <!-- Bouton de retour vers por.html -->
    <a href="k.html" class="back-button">
        &#8592; Retour
    </a>

    <!-- Conteneur centré -->
    <div class="main-container">
        <div class="glass-card">
            <div>
                <!-- En-tête -->
                <div class="header">
                    <div class="porsche-logo">OMEGA</div>
                </div>

                <!-- Corps du formulaire -->
                <h1>Connectez-vous avec votre OMEGA ID</h1>

                <form>
                    <div class="input-group">
                        <label for="porsche-id">OMEGA ID (e-mail) *</label>
                        <input type="email" id="porsche-id" placeholder="exemple@domain.com" required>
                    </div>

                    <div class="input-group">
                        <label for="porsche-password">Mot de passe *</label>
                        <input type="password" id="porsche-password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-continue">Continuer</button>
                </form>
            </div>

            <!-- Pied de page -->
            <div class="register-section">
                Vous n'avez pas d'OMEGA ID ? <a href="#">S'inscrire maintenant</a>
            </div>
        </div>
    </div>

</body>
</html>

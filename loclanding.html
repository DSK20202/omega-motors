<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMOS - Landing Page</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh;
        background: #000000;
        color: #fff;
        overflow: hidden;
      }

      /* Vidéo en arrière-plan responsive */
      video {
        position: fixed;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        object-fit: cover;
        z-index: -1;
        filter: brightness(0.65);
      }

        /* Barre de navigation supérieure en verre (Fond Blanc) */
      .top-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px; 
        background: rgba(255, 255, 255, 0.85); /* Blanc translucide */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08); /* Bordure subtile sombre */
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); /* Ombre douce et légère */
      }

      .top-nav h1 {
        font-size: 1.8rem;
        letter-spacing: 6px;
        margin: 0;
        color: #111827; /* Texte sombre pour un contraste parfait */
        opacity: 0;
        transform: translateY(-10px);
        animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Barre de navigation inférieure en verre (Fond Blanc) */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: rgba(255, 255, 255, 0.85); /* Blanc translucide */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(0, 0, 0, 0.08); /* Bordure supérieure subtile sombre */
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04); /* Ombre vers le haut douce */
        padding: 0 20px;
        box-sizing: border-box;
      }

      /* Logo et texte parfaitement alignés et centrés dans la nav bar du bas */
      .bottom-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInUpLogo 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }

      .bottom-logo {
        font-size: 0.95rem;
        letter-spacing: 4px;
        font-weight: 700;
        color: rgb(0, 0, 0);
        margin: 0;
      }

      .bottom-subtext {
        font-size: 0.6rem;
        letter-spacing: 2px;
        color: rgb(0, 0, 0);
        margin: 0;
        text-transform: uppercase;
      }

      /* Bouton de son intégré */
      .sound-btn {
        position: absolute;
        right: 20px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 6px 12px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.35s ease;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .sound-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.5);
        transform: scale(1.05);
      }

      .content {
        text-align: center;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        padding: 0 20px;
      }

      /* Conteneur des boutons au milieu */
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }

      /* Boutons principaux au style Glassmorphism */
      .buttons a {
        text-decoration: none;
        color: #fff;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 14px 20px;
        border-radius: 50px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .buttons a:hover {
        background: rgba(255, 255, 255, 0.28);
        border-color: rgba(255, 255, 255, 0.6);
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      }

      /* Media Queries pour petits écrans (smartphones) */
      @media (max-width: 480px) {
        .top-nav h1 {
          font-size: 1.5rem;
          letter-spacing: 4px;
        }
        .bottom-subtext {
          display: none; /* Cache le sous-texte sur les très petits écrans pour gagner de la place */
        }
        .sound-btn {
          padding: 5px 10px;
          font-size: 11px;
          right: 15px;
        }
      }

      /* Animations fluides */
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeInUpLogo {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <!-- Vidéo d'arrière-plan -->
    <video id="bg-video" autoplay muted playsinline loop>
      <source src="capcutvp.mp4" type="video/mp4" />
    </video>

    <!-- Barre de navigation supérieure en verre -->
    <header class="top-nav">
      <h1>OMEGA</h1>
    </header>

    <!-- Contenu central (Boutons) -->
    <div class="content">
      <div class="buttons">
        <a href="index.html">Se connecter</a>
        <a href="creeruncompte.html">Créer un compte</a>
      </div>
    </div>

    <!-- Barre de navigation inférieure en verre -->
    <footer class="bottom-nav">
      <div class="bottom-content">
        <div class="bottom-logo">CHZ</div>
        <div class="bottom-subtext">TO INFINTY AND BEYOND</div>
      </div>
      <!-- Bouton de son intégré -->
      <button id="soundToggle" class="sound-btn">
        <span id="soundIcon">🔇</span> 
      </button>
    </footer>

    <script>
      const video = document.getElementById('bg-video');
      const soundBtn = document.getElementById('soundToggle');
      const soundIcon = document.getElementById('soundIcon');

      // Gestion du son
      soundBtn.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
          video.volume = 1.0;
          soundIcon.textContent = '🔊';
        } else {
          video.muted = true;
          soundIcon.textContent = '🔇';
        }
      });

      // Correction pour relancer la vidéo lorsqu'on revient sur la page via le bouton "Retour"
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          video.currentTime = 0;
          video.play().catch(() => {});
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un identifiant - Porsche ID</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }

        /* Conteneur de l'image en arrière-plan */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .background-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Bouton Retour vers por.html */
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            text-decoration: none;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            z-index: 3;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(3deg) scale(1.02);
            color: #fff;
        }

        /* Conteneur principal pour centrer le cadre */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* Cadre en verre translucide (Glassmorphism) au format portrait */
        .glass-card {
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        /* En-tête Porsche parfaitement centré */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .porsche-logo {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 15px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .porsche-logo:hover {
            opacity: 0.8;
        }

        /* Titre sur une seule ligne */
        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .description {
            font-size: 11px;
            color: #f1f1f1;
            margin-bottom: 15px;
            line-height: 1.3;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #f1f1f1;
            margin-bottom: 4px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="text"],
        select {
            width: 100%;
            padding: 10px 12px;
            background-color: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 13px;
            color: #000;
            outline: none;
            transition: all 0.2s;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        input:focus, select:focus {
            border-color: #fff;
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* Checkbox termes */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 12px 0;
            font-size: 11px;
            color: #f1f1f1;
        }

        .terms-group input {
            margin-top: 2px;
        }

        .terms-group a {
            color: #fff;
            text-decoration: underline;
        }

        .legal-text {
            font-size: 10px;
            color: #e0e0e0;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .legal-text a {
            color: #fff;
            text-decoration: underline;
        }

        /* Bouton Continuer */
        .btn-continue {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-continue:hover {
            background-color: #222;
        }

        /* Responsive pour mobiles */
        @media (max-width: 480px) {
            .glass-card {
                padding: 20px 15px;
                max-height: 95vh;
            }
            h1 {
                font-size: 14px;
            }
        }
    </style>
</head>
